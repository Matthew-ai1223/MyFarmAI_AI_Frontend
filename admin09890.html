<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFarmAI | Vet Connect Admin Monitor</title>
    <meta name="description" content="Vet Connect admin monitor for users, chats, products, and platform activity.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#091015; --panel:#0f1a21; --line:#1f3340; --text:#e9f3f8; --muted:#8ba0ad; --ok:#10b981; }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,sans-serif; }
        .container { max-width:1280px; margin:0 auto; padding:20px; }
        .head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
        .title { font-size:24px; font-weight:800; }
        .muted { color:var(--muted); font-size:13px; }
        .controls { display:flex; gap:8px; flex-wrap:wrap; }
        button, select { border:1px solid var(--line); background:#0b141a; color:var(--text); border-radius:10px; padding:8px 10px; }
        .primary { background:var(--ok); color:#032117; font-weight:700; border:0; cursor:pointer; }
        .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:14px 0; }
        .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
        .k { font-size:12px; color:var(--muted); text-transform:uppercase; }
        .v { font-size:28px; font-weight:800; margin-top:4px; }
        .main { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .panel-title { margin:0 0 8px 0; font-size:15px; }
        .tbl { width:100%; border-collapse:collapse; font-size:13px; }
        .tbl th,.tbl td{ border-bottom:1px solid var(--line); padding:8px; text-align:left; vertical-align:top; }
        .scroll { max-height:350px; overflow:auto; }
        .activity { border-bottom:1px solid var(--line); padding:8px 0; font-size:13px; }
        .chat { max-height:350px; overflow:auto; background:#101f27; border:1px solid var(--line); border-radius:10px; padding:8px; }
        .msg { margin-bottom:8px; font-size:13px; line-height:1.4; }
        @media (max-width:980px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr));} .main{grid-template-columns:1fr;} }
    </style>
</head>
<body>
    <div class="container">
        <div class="head">
            <div>
                <div class="title">Vet Connect Admin Monitor</div>
                <div class="muted">Realtime visibility for users, chats, products, and system activity.</div>
            </div>
            <div class="controls">
                <select id="api-base">
                    <option value="http://localhost:3000/api">Local API</option>
                    <option value="https://farm-ai-iota.vercel.app/api">Production API</option>
                </select>
                <button class="primary" id="refresh">Refresh</button>
            </div>
        </div>

        <div class="stats">
            <div class="card"><div class="k">Users</div><div class="v" id="s-users">0</div></div>
            <div class="card"><div class="k">Active Users</div><div class="v" id="s-active">0</div></div>
            <div class="card"><div class="k">Messages</div><div class="v" id="s-msg">0</div></div>
            <div class="card"><div class="k">Products</div><div class="v" id="s-products">0</div></div>
        </div>

        <div class="main">
            <div class="card">
                <h3 class="panel-title">Users</h3>
                <div class="scroll">
                    <table class="tbl">
                        <thead><tr><th>Email</th><th>Convos</th><th>Messages</th><th>Last Seen</th></tr></thead>
                        <tbody id="users-body"></tbody>
                    </table>
                </div>
            </div>
            <div class="card">
                <h3 class="panel-title">Recent Activity</h3>
                <div class="scroll" id="activity-list"></div>
            </div>
        </div>

        <div class="main" style="margin-top:12px;">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;">
                    <h3 class="panel-title" style="margin:0;">User Chat</h3>
                    <select id="chat-user"></select>
                </div>
                <div class="chat" id="chat-box">Select a user to inspect chat logs.</div>
            </div>
            <div class="card">
                <h3 class="panel-title">Products</h3>
                <div class="scroll">
                    <table class="tbl">
                        <thead><tr><th>Title</th><th>Price</th><th>Seller</th><th>Created</th></tr></thead>
                        <tbody id="products-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <p class="muted" id="status">Ready.</p>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const state = { data: null };
        const fmtN = (n) => new Intl.NumberFormat().format(n || 0);
        const fmtD = (d) => d ? new Date(d).toLocaleString() : "-";

        async function load() {
            try {
                $("status").textContent = "Loading admin data...";
                const res = await fetch(`${$("api-base").value}/admin/overview`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data.status !== "success") throw new Error(data.message || "Unknown error");
                state.data = data;
                render();
                $("status").textContent = `Loaded at ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                $("status").textContent = `Load failed: ${e.message}`;
            }
        }

        function render() {
            const d = state.data;
            $("s-users").textContent = fmtN(d.summary.users);
            $("s-active").textContent = fmtN(d.summary.activeUsers);
            $("s-msg").textContent = fmtN(d.summary.messages);
            $("s-products").textContent = fmtN(d.summary.products);

            const uBody = $("users-body");
            uBody.innerHTML = "";
            (d.users || []).forEach((u) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${u.email}</td><td>${fmtN(u.conversations)}</td><td>${fmtN(u.messages)}</td><td>${fmtD(u.lastSeen)}</td>`;
                uBody.appendChild(tr);
            });

            const pBody = $("products-body");
            pBody.innerHTML = "";
            (d.products || []).forEach((p) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${p.title || "Untitled"}</td><td>N${fmtN(p.price)}</td><td>${p.sellerEmail || "-"}</td><td>${fmtD(p.createdAt)}</td>`;
                pBody.appendChild(tr);
            });

            const aList = $("activity-list");
            aList.innerHTML = "";
            (d.activity || []).slice(0, 80).forEach((a) => {
                const div = document.createElement("div");
                div.className = "activity";
                div.innerHTML = `<div>${a.label}</div><div class="muted">${a.email || "system"} - ${fmtD(a.timestamp)}</div>`;
                aList.appendChild(div);
            });

            const chatUser = $("chat-user");
            chatUser.innerHTML = "";
            Object.keys(d.chats || {}).forEach((email) => {
                const op = document.createElement("option");
                op.value = email;
                op.textContent = email;
                chatUser.appendChild(op);
            });
            chatUser.onchange = () => renderChat(chatUser.value);
            if (chatUser.options.length) renderChat(chatUser.value || chatUser.options[0].value);
        }

        function renderChat(email) {
            const box = $("chat-box");
            const logs = state.data?.chats?.[email] || [];
            if (!logs.length) {
                box.textContent = "No chat data for this user.";
                return;
            }
            box.innerHTML = "";
            logs.forEach((m) => {
                const safe = (m.content || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                const div = document.createElement("div");
                div.className = "msg";
                div.innerHTML = `<strong>${m.role}</strong>: ${safe}<div class="muted">${fmtD(m.timestamp)}</div>`;
                box.appendChild(div);
            });
        }

        $("refresh").addEventListener("click", load);
        load();
    </script>
</body>
</html>
